<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Carrito | Mi Tienda 3D & Tech
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- =====================================================
         CABECERA
         ===================================================== -->

    <header>

        <h1>
            Impresiones 3D & Tech
        </h1>


        <nav>

            <a href="index.html">
                🖨️ Impresiones 3D
            </a>


            <a href="tecnologia.html">
                💻 Tecnología
            </a>


            <a href="cartas.html">
                🃏 Cartas
            </a>


            <a
                href="carrito.html"
                class="activo"
            >
                🛒 Carrito
                (
                <span id="contador-carrito">
                    0
                </span>
                )
            </a>

        </nav>

    </header>



    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main>


        <!-- TÍTULO -->

        <div class="titulo-seccion">

            🛒 Carrito

            <span>
                | Tu Carrito de Compras
            </span>

        </div>



        <!-- =================================================
             CONTENEDOR DEL CARRITO

             cart.js colocará aquí:

             - productos
             - cantidad
             - botón +
             - botón -
             - subtotal
             - eliminar
             - total
             ================================================= -->

        <div
            id="contenedor-carrito"
            style="margin-bottom: 30px;"
        >

            <div
                style="
                    background: white;
                    border: 1px solid #ddd;
                    border-radius: 6px;
                    padding: 30px;
                    text-align: center;
                "
            >

                <p>
                    🛒 Cargando carrito...
                </p>

            </div>

        </div>



        <!-- =================================================
             CHECKOUT
             ================================================= -->

        <section
            id="seccion-checkout"
            style="
                background: white;
                padding: 25px;
                border-radius: 6px;
                border: 1px solid #ddd;
                max-width: 700px;
                display: none;
                margin-bottom: 40px;
            "
        >


            <h2
                style="
                    margin-bottom: 5px;
                    font-size: 1.3rem;
                "
            >
                📦 Datos de contacto
            </h2>


            <p
                style="
                    color: #666;
                    font-size: 0.9rem;
                    margin-bottom: 20px;
                "
            >
                Completa tus datos para coordinar el pedido.
            </p>



            <!-- FORMULARIO -->

            <form id="form-checkout">


                <!-- NOMBRE -->

                <div
                    style="
                        margin-bottom: 15px;
                    "
                >

                    <label
                        for="cliente-nombre"
                        style="
                            display: block;
                            font-size: 0.9rem;
                            margin-bottom: 6px;
                            font-weight: bold;
                        "
                    >
                        Nombre Completo
                    </label>


                    <input
                        type="text"
                        id="cliente-nombre"
                        name="nombre"
                        placeholder="Ej: Manuel Crisóstomo"
                        autocomplete="name"
                        required
                        style="
                            width: 100%;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 4px;
                            box-sizing: border-box;
                        "
                    >

                </div>



                <!-- TELÉFONO -->

                <div
                    style="
                        margin-bottom: 15px;
                    "
                >

                    <label
                        for="cliente-telefono"
                        style="
                            display: block;
                            font-size: 0.9rem;
                            margin-bottom: 6px;
                            font-weight: bold;
                        "
                    >
                        Teléfono / WhatsApp
                    </label>


                    <input
                        type="tel"
                        id="cliente-telefono"
                        name="telefono"
                        placeholder="Ej: +56912345678"
                        autocomplete="tel"
                        required
                        style="
                            width: 100%;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 4px;
                            box-sizing: border-box;
                        "
                    >

                </div>



                <!-- CORREO -->

                <div
                    style="
                        margin-bottom: 15px;
                    "
                >

                    <label
                        for="cliente-correo"
                        style="
                            display: block;
                            font-size: 0.9rem;
                            margin-bottom: 6px;
                            font-weight: bold;
                        "
                    >
                        Correo Electrónico
                    </label>


                    <input
                        type="email"
                        id="cliente-correo"
                        name="correo"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                        style="
                            width: 100%;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 4px;
                            box-sizing: border-box;
                        "
                    >

                </div>



                <!-- DIRECCIÓN -->

                <div
                    style="
                        margin-bottom: 20px;
                    "
                >

                    <label
                        for="cliente-direccion"
                        style="
                            display: block;
                            font-size: 0.9rem;
                            margin-bottom: 6px;
                            font-weight: bold;
                        "
                    >
                        Dirección de Despacho / Nota
                    </label>


                    <textarea
                        id="cliente-direccion"
                        name="direccion"
                        rows="4"
                        placeholder="Calle, número, comuna u observaciones..."
                        required
                        style="
                            width: 100%;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 4px;
                            box-sizing: border-box;
                            resize: vertical;
                        "
                    ></textarea>

                </div>



                <!-- =================================================
                     BOTONES DE ENVÍO
                     ================================================= -->

                <div
                    style="
                        display: flex;
                        gap: 10px;
                        flex-wrap: wrap;
                    "
                >


                    <!-- WHATSAPP -->

                    <button
                        type="button"
                        id="btn-whatsapp"
                        style="
                            flex: 1;
                            min-width: 220px;
                            background: #25d366;
                            color: white;
                            border: none;
                            padding: 13px;
                            border-radius: 4px;
                            font-weight: bold;
                            cursor: pointer;
                            font-size: 1rem;
                        "
                    >

                        📲 Enviar por WhatsApp

                    </button>



                    <!-- CORREO -->

                    <button
                        type="button"
                        id="btn-correo"
                        style="
                            flex: 1;
                            min-width: 220px;
                            background: #2980b9;
                            color: white;
                            border: none;
                            padding: 13px;
                            border-radius: 4px;
                            font-weight: bold;
                            cursor: pointer;
                            font-size: 1rem;
                        "
                    >

                        📧 Enviar por Correo

                    </button>


                </div>


            </form>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        type="module"
        src="src/cart.js"
    ></script>


</body>

</html>
